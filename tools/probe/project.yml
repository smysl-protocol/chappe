# Одноразовый измерительный пробник BLE-фона (оценка транспорта
# «телефон↔телефон», 06.08.2026). НЕ продукт: отдельный проект,
# в основной таргет не входит, после снятия замеров может быть удалён.
name: ChappeProbe
options:
  bundleIdPrefix: com.chappe
  deploymentTarget:
    iOS: "18.0"
targets:
  ChappeProbe:
    type: application
    platform: iOS
    sources: [Probe]
    settings:
      base:
        DEVELOPMENT_TEAM: 
        PRODUCT_BUNDLE_IDENTIFIER: com.chappe.probe
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Замер фонового BLE-обнаружения (измерительная утилита)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Probe/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: >-
          Замер фонового BLE-обнаружения (измерительная утилита)
        # без криптографии: снимает вопрос экспортной декларации при загрузке
        ITSAppUsesNonExemptEncryption: false
